sonar.projectKey=trade-reporting-boost-demo
sonar.projectName=Trade Reporting C++ - Boost.Test
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Le code métier est distinct des fichiers de tests.
sonar.sources=src,include
sonar.tests=tests

# Obligatoire pour activer le capteur CXX du plugin communautaire sonar-cxx.
sonar.cxx.file.suffixes=.cpp,.hpp
sonar.cxx.includeDirectories=include

# Rapport de couverture générique produit par gcovr --sonarqube.
sonar.coverageReportPaths=reports/coverage-sonarqube.xml

# L'URL peut être remplacée par la variable SONAR_HOST_URL dans le script.
sonar.host.url=http://localhost:9000
